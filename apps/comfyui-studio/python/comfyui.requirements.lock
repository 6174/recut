# [INPUT]: 由 bootstrap.py 读取并安装进 comfyui runtime 专属 venv；ComfyUI 源码由 bootstrap.py 按
#          python/runtimes.json 的 repository/revision 固定 commit 浅克隆。
# [OUTPUT]: 重建 ComfyUI 运行环境（torch + ComfyUI 全量依赖闭包）。
# [POS]: comfyui-studio 共享 runtime 的锁文件；只装进 <venv>-comfyui，不装进主 venv。
